<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ilogia · لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF9F5;--cream:#F4F1EA;--card:#fff;--line:#E4DFD5;--ink:#192428;--mut:#5C6B66;--pri:#005542;--pri2:#136f58;--gold:#cba72f;--goldd:#735c00;--err:#ba1a1a;--errbg:#ffdad6;--ok:#e3f3ec;--r:10px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:'Noto Serif','IBM Plex Sans Arabic',serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
.hide{display:none!important}
.brand{font-family:'Noto Serif',serif;font-weight:700;color:var(--pri);direction:ltr;font-size:22px}
#login{min-height:100%;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--pri2);border-radius:var(--r);padding:24px;width:100%;max-width:360px;display:grid;gap:10px}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;width:100%}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--cream)}.btn.p{background:var(--pri2);border-color:var(--pri2);color:#fff}.btn.p:hover{background:var(--pri)}
.btn.d{border-color:#ba1a1a66;color:var(--err)}.btn.d:hover{background:var(--errbg)}.btn[disabled]{opacity:.5;cursor:wait}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--pri);color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{color:#fff;padding:0 8px 14px;display:block}
nav a{display:block;color:#d7efe6;padding:9px 12px;border-radius:8px;cursor:pointer;text-decoration:none}
nav a:hover{background:#ffffff1a}nav a.on{background:#fff;color:var(--pri);font-weight:700}
main{padding:0 20px 40px;min-width:0}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:18px;position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.top h2{font-size:20px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#menu{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat small{color:var(--mut)}.stat b{display:block;font-size:24px;margin-top:2px;direction:ltr;text-align:start}
.stat.w{background:#fbf3d6;border-color:#cba72f66}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.panel h3{font-size:16px;margin-bottom:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:12px;background:var(--cream)}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;border:1px solid var(--line);background:var(--cream)}
.tag.active,.tag.approved{background:var(--ok);color:var(--pri2);border-color:#136f5844}.tag.pending{background:#fbf3d6;color:var(--goldd)}
.tag.rejected,.tag.failed{background:var(--errbg);color:var(--err)}
.empty{padding:28px;text-align:center;color:var(--mut)}
.bars{display:flex;gap:4px;align-items:flex-end;height:90px;direction:ltr}
.bars i{flex:1;background:var(--pri2);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;font-style:normal;padding:1px 6px;border-radius:4px;white-space:nowrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:end}
.form label{display:grid;gap:3px;color:var(--mut);font-size:12px}
.msg{color:var(--err);margin-top:6px;min-height:18px}.msg.ok{color:var(--pri2)}
#toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;z-index:50}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:fixed;inset-block:0;inset-inline-start:0;width:230px;z-index:20;transform:translateX(100%);transition:transform .2s}html[dir=ltr] aside{transform:translateX(-100%)}aside.open{transform:none!important}#menu{display:inline-block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login" class="hide"><form class="box" id="lf">
  <span class="brand">ilogia</span><h2 id="lt"></h2>
  <input id="em" type="email" autocomplete="username" required><input id="pw" type="password" autocomplete="current-password" required>
  <button class="btn p" id="lb"></button><div class="msg" id="le"></div>
  <button type="button" class="btn" id="ll"></button>
</form></div>

<div id="app" class="hide">
  <aside id="side"><span class="brand">ilogia</span><nav id="nav"></nav></aside>
  <main><div class="top"><div class="row"><button class="btn" id="menu">☰</button><h2 id="title"></h2></div>
    <div class="row"><span id="who" style="color:var(--mut)"></span><button class="btn" id="lang">EN</button><button class="btn" id="ref"></button><button class="btn d" id="out"></button></div></div>
    <div id="view"></div></main>
</div>
<div id="toast" class="hide" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB=supabase.createClient('https://zugwicbbfbefbbwugfxq.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1Z3dpY2JiZmJlZmJid3VnZnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjk5NzgsImV4cCI6MjEwNjgwNTk3OH0.mR_mr4PXgwEUX9nnAdmZpC7wU05KhlM75eMZ6kvaO6s',{auth:{persistSession:true,storageKey:'ilogia-dash-auth'}});
let lang=localStorage.getItem('dl')||'ar',perms=new Set(),cur='overview',me=null;
const $=s=>document.querySelector(s),T=(a,e)=>lang==='ar'?a:e;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=s=>s?new Date(s).toLocaleDateString(lang==='ar'?'ar-EG':'en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'#';
const q=async p=>{const{data,error}=await p;if(error)throw error;return data};
const cnt=async t=>{const{count,error}=await SB.from(t).select('*',{count:'exact',head:true});return error?null:count};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.x);toast.x=setTimeout(()=>t.classList.add('hide'),3500)}
const empty=m=>`<div class="empty">${esc(m||T('لا توجد بيانات بعد','Nothing here yet'))}</div>`;
const tag=s=>`<span class="tag ${esc(s)}">${esc(({pending:T('قيد المراجعة','Pending'),active:T('مفعّل','Active'),rejected:T('مرفوض','Rejected'),expired:T('منتهي','Expired'),approved:T('مقبول','Approved')})[s]||s)}</span>`;
function csv(name,rows){if(!rows.length)return toast(T('لا توجد بيانات للتصدير','No data to export'));
 const k=Object.keys(rows[0]),f=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const b=new Blob(['\ufeff'+[k.join(','),...rows.map(r=>k.map(c=>f(r[c])).join(','))].join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.csv';a.click()}
// a payment counts as revenue only if the gateway confirmed it or an admin approved a manual receipt
const paid=s=>s.status==='active'&&(s.payment_method==='fawaterk'?s.payment_status==='paid':s.payment_method!=='free');
const NAV=[['overview','نظرة عامة','Overview','dashboard.view'],['subs','الاشتراكات','Subscriptions','payments.view'],['students','الطلاب','Students','users.view'],['teachers','المعلمون','Teachers','users.view'],['content','المحتوى','Content','courses.view'],['courses','الدورات','Courses','courses.view'],['certs','الشهادات','Certificates','certificates.view'],['support','الدعم','Support','support.view'],['gateway','سجل الدفع','Payment log','payments.view'],['roles','الأدوار','Roles','roles.view'],['audit','سجل التدقيق','Audit log','logs.view']];
function shell(){
 $('#nav').innerHTML=NAV.filter(n=>perms.has(n[3])).map(n=>`<a data-go="${n[0]}" class="${n[0]===cur?'on':''}">${T(n[1],n[2])}</a>`).join('');
 $('#ref').textContent=T('تحديث','Refresh');$('#out').textContent=T('خروج','Sign out');
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#lang').textContent=lang==='ar'?'EN':'عربي';
 $('#title').textContent=T(...NAV.find(n=>n[0]===cur).slice(1,3))}
async function go(v){cur=v||cur;shell();$('#side').classList.remove('open');const el=$('#view');el.innerHTML=empty(T('جارٍ التحميل…','Loading…'));
 try{el.innerHTML=await V[cur]()}catch(e){el.innerHTML=`<div class="panel msg">${esc(e.message||e)}</div>`}}

const V={
async overview(){
 const[p,s,lib,co,le,ex,ce]=await Promise.all([q(SB.from('profiles').select('created_at,is_teacher,is_platform_admin,is_active')),q(SB.from('subscriptions').select('status,payment_method,payment_status,amount')),cnt('library_items'),cnt('courses'),cnt('lessons'),cnt('exams_attempts'),cnt('certificates')]);
 const st=p.filter(x=>!x.is_teacher&&!x.is_platform_admin),days=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*864e5).toISOString().slice(0,10);return[d,p.filter(x=>x.created_at.slice(0,10)===d).length]}),mx=Math.max(1,...days.map(d=>d[1]));
 const rev=s.filter(paid).reduce((a,x)=>a+Number(x.amount||0),0),c=k=>s.filter(x=>x.status===k).length;
 const S=(l,v,w)=>`<div class="stat ${w?'w':''}"><small>${l}</small><b>${esc(v??'—')}</b></div>`;
 return `<div class="grid">${S(T('الطلاب','Students'),st.length)}${S(T('المعلمون','Teachers'),p.filter(x=>x.is_teacher).length)}${S(T('طلبات قيد المراجعة','Pending requests'),c('pending'),c('pending')>0)}${S(T('اشتراكات مفعّلة','Active subscriptions'),c('active'))}${S(T('الإيراد المؤكد (ج.م)','Confirmed revenue (EGP)'),rev)}${S(T('ملفات المكتبة','Library items'),lib)}${S(T('الدورات / الدروس','Courses / lessons'),`${co??'—'} / ${le??'—'}`)}${S(T('محاولات الامتحانات','Exam attempts'),ex)}${S(T('الشهادات','Certificates'),ce)}</div>
 <div class="panel"><h3>${T('التسجيلات آخر ١٤ يوماً','Registrations, last 14 days')}</h3><div class="bars">${days.map(d=>`<i style="height:${d[1]/mx*100}%" data-t="${d[0]}: ${d[1]}"></i>`).join('')}</div></div>
 <p style="color:var(--mut)">${T('الإيراد يشمل المدفوعات المؤكدة فقط، ولا يشمل التفعيل اليدوي للتجربة.','Revenue counts gateway-confirmed or approved receipts only, not hand-activated tests.')}</p>`},

async subs(){
 const[s,pr,pl]=await Promise.all([q(SB.from('subscriptions').select('*').order('created_at',{ascending:false})),q(SB.from('profiles').select('id,full_name,email')),q(SB.from('plans').select('id,name'))]);
 const P=Object.fromEntries(pr.map(x=>[x.id,x])),L=Object.fromEntries(pl.map(x=>[x.id,x.name]));
 const paths=s.map(x=>x.receipt_path).filter(Boolean),u={};
 if(paths.length)((await SB.storage.from('receipts').createSignedUrls(paths,3600)).data||[]).forEach(x=>u[x.path]=x.signedUrl);
 window._subs=s.map(x=>({id:x.id,name:P[x.user_id]?.full_name||'',email:P[x.user_id]?.email||'',plan:L[x.plan_id]||'',status:x.status,method:x.payment_method,amount:x.amount,payment_status:x.payment_status,paid_at:x.paid_at,created:x.created_at,expires:x.expires_at,ref:x.payment_ref,receipt:u[x.receipt_path]||''}));
 return `<div class="panel"><div class="row" style="margin-bottom:10px"><input id="f" style="max-width:240px" placeholder="${T('بحث بالاسم أو البريد','Search name or email')}"><select id="fs" style="max-width:150px"><option value="">${T('كل الحالات','All statuses')}</option>${['pending','active','rejected','expired'].map(k=>`<option value="${k}">${T(...{pending:['قيد المراجعة','Pending'],active:['مفعّل','Active'],rejected:['مرفوض','Rejected'],expired:['منتهي','Expired']}[k])}</option>`).join('')}</select><button class="btn" data-act="exp-subs">CSV</button></div><div class="tw" id="tb"></div></div>`},

async students(){
 const[p,g]=await Promise.all([q(SB.from('profiles').select('id,full_name,email,phone,grade_id,governorate,is_active,is_teacher,is_platform_admin,created_at').order('created_at',{ascending:false})),q(SB.from('grades').select('id,name'))]);
 const G=Object.fromEntries(g.map(x=>[x.id,x.name]));window._stu=p.map(x=>({...x,grade:G[x.grade_id]||''}));
 return `<div class="panel"><div class="row" style="margin-bottom:10px"><input id="f" style="max-width:260px" placeholder="${T('بحث','Search')}"><button class="btn" data-act="exp-stu">CSV</button></div><div class="tw" id="tb"></div><p style="color:var(--mut)">${T('الإيقاف هنا يوقف صلاحيات الأدمن فقط، حظر الجلسة يحتاج دالة خادم (قيد الإنشاء).','Suspending here blocks admin rights only; ending the session needs a server function (not built yet).')}</p></div>`},

async teachers(){
 const[r,t]=await Promise.all([q(SB.rpc('admin_list_teacher_requests')),q(SB.rpc('admin_list_teachers'))]);
 const rq=(r||[]).filter(x=>x.status==='pending');
 return `<div class="panel"><h3>${T('طلبات الانضمام كمعلم','Teacher requests')} (${rq.length})</h3>${rq.length?`<div class="tw"><table>${rq.map(x=>`<tr><td>${esc(x.full_name)}<br><small>${esc(x.email||x.phone||'')}</small></td><td>${esc(x.subject||'')}</td><td>${esc(x.bio||'')}</td><td class="row"><button class="btn p" data-act="tr" data-id="${x.id}" data-a="approved">${T('قبول','Approve')}</button><button class="btn d" data-act="tr" data-id="${x.id}" data-a="rejected">${T('رفض','Reject')}</button></td></tr>`).join('')}</table></div>`:empty()}</div>
 <div class="panel"><h3>${T('المعلمون الحاليون','Current teachers')}</h3><form class="row" id="atf" style="margin-bottom:10px"><input id="ate" type="email" required style="max-width:280px" placeholder="${T('بريد المعلم','Teacher email')}"><button class="btn p">${T('إضافة','Add')}</button></form>${(t||[]).length?`<div class="tw"><table>${t.map(x=>`<tr><td>${esc(x.full_name||'')}</td><td>${esc(x.email||'')}</td><td><button class="btn d" data-act="rt" data-e="${esc(x.email)}">${T('إلغاء الصلاحية','Revoke')}</button></td></tr>`).join('')}</table></div>`:empty()}</div>`},

async content(){
 const[g,s,l]=await Promise.all([q(SB.from('grades').select('*').order('sort_order')),q(SB.from('subjects').select('*').order('sort_order')),q(SB.rpc('admin_list_library'))]);
 window._g=g;window._s=s;const opt=a=>a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 const G=Object.fromEntries(g.map(x=>[x.id,x.name])),S=Object.fromEntries(s.map(x=>[x.id,x.name]));
 return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
 <div class="panel"><h3>${T('الصفوف','Grades')}</h3><form id="gf" class="row"><input id="gn" required placeholder="${T('اسم الصف','Grade name')}"><button class="btn p">+</button></form><div class="tw"><table>${g.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.stage||'')}</td><td><button class="btn d" data-act="del" data-t="grades" data-id="${x.id}">×</button></td></tr>`).join('')}</table></div></div>
 <div class="panel"><h3>${T('المواد','Subjects')}</h3><form id="sf" class="row"><input id="sn" required placeholder="${T('اسم المادة','Subject name')}"><button class="btn p">+</button></form><div class="tw"><table>${s.map(x=>`<tr><td>${esc(x.name)}</td><td><button class="btn d" data-act="del" data-t="subjects" data-id="${x.id}">×</button></td></tr>`).join('')}</table></div></div></div>
 <div class="panel"><h3>${T('إضافة ملف للمكتبة (رابط)','Add library item (link)')}</h3><form id="lf2" class="form"><label>${T('العنوان','Title')}<input id="lt2" required></label><label>${T('الوحدة','Unit')}<input id="lu"></label><label>${T('الصف','Grade')}<select id="lg">${opt(g)}</select></label><label>${T('المادة','Subject')}<select id="ls" required>${opt(s)}</select></label><label>${T('العام الدراسي','Year')}<input id="ly"></label><label>${T('الرابط','URL')}<input id="lr" type="url" required dir="ltr"></label><label><span>${T('مجاني','Free')}</span><input id="lfree" type="checkbox" style="width:auto"></label><button class="btn p">${T('إضافة','Add')}</button></form><div class="msg" id="lm"></div></div>
 <div class="panel"><h3>${T('المكتبة','Library')} (${(l||[]).length})</h3>${(l||[]).length?`<div class="tw"><table>${l.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(G[x.grade_id]||'')}</td><td>${esc(S[x.subject_id]||'')}</td><td>${x.is_free?T('مجاني','Free'):T('مدفوع','Paid')}</td><td><button class="btn d" data-act="del" data-t="library_items" data-id="${x.id}">×</button></td></tr>`).join('')}</table></div>`:empty()}</div>`},

async courses(){
 const[c,l]=await Promise.all([q(SB.from('courses').select('*').order('created_at')),q(SB.from('lessons').select('id,course_id,title,is_published,order_index').order('order_index'))]);
 return `<div class="panel">${c.length?`<div class="tw"><table><tr><th>${T('الدورة','Course')}</th><th>${T('المعلم','Teacher')}</th><th>${T('الدروس','Lessons')}</th><th>${T('النشر','Published')}</th></tr>${c.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.teacher_name||'')}</td><td>${l.filter(y=>y.course_id===x.id).length}</td><td><button class="btn ${x.is_published?'p':''}" data-act="pub" data-id="${x.id}" data-v="${!x.is_published}">${x.is_published?T('منشورة','Published'):T('مسودة','Draft')}</button></td></tr>`).join('')}</table></div>`:empty()}</div>`},

async certs(){return `<div class="panel"><h3>${T('التحقق من شهادة / إلغاؤها','Verify or revoke a certificate')}</h3><form id="cf" class="row"><input id="cs" required dir="ltr" style="max-width:240px" placeholder="${T('الرقم التسلسلي','Serial')}"><button class="btn" data-m="v">${T('تحقق','Verify')}</button><button class="btn d" data-m="r">${T('إلغاء الشهادة','Revoke')}</button></form><pre id="co" style="white-space:pre-wrap;direction:ltr"></pre></div>`},

async support(){const t=await q(SB.from('feedback_tickets').select('*').order('created_at',{ascending:false}));
 return `<div class="panel">${t.length?`<div class="tw"><table>${t.map(x=>`<tr><td>${esc(x.title)}<br><small>${esc(x.description||'')}</small></td><td>${esc(x.student_name||'')}<br><small>${esc(x.student_email||'')}</small></td><td>${esc(x.category||'')}</td><td>${esc(x.status||'')}</td><td>${fd(x.created_at)}</td></tr>`).join('')}</table></div>`:empty()}</div>`},

async gateway(){const e=await q(SB.from('fawaterk_events').select('*').order('created_at',{ascending:false}).limit(100));
 return `<div class="panel"><p style="color:var(--mut)">${T('كل نداءات بوابة الدفع. الاسترجاع يحتاج مراجعة يدوية.','Every payment-gateway call. Refunds need manual review.')}</p>${e.length?`<div class="tw"><table>${e.map(x=>`<tr><td>${fd(x.created_at)}</td><td>${esc(x.kind)}</td><td>${tag(x.ok?'active':'failed')}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</table></div>`:empty(T('لم تصل أي نداءات من بوابة الدفع بعد','No gateway calls received yet'))}</div>`},

async roles(){const[r,p,rp,ur]=await Promise.all([q(SB.from('roles').select('*')),q(SB.from('permissions').select('*')),q(SB.from('role_permissions').select('*')),q(SB.from('user_roles').select('*'))]);
 const P=Object.fromEntries(p.map(x=>[x.id,x.code]));
 return r.map(x=>`<div class="panel"><h3>${esc(x.name)} <small style="font-weight:400;color:var(--mut)">${esc(x.description||'')} · ${ur.filter(u=>u.role_id===x.id).length} ${T('مستخدم','users')}</small></h3><div>${rp.filter(y=>y.role_id===x.id).map(y=>`<span class="tag" dir="ltr">${esc(P[y.permission_id])}</span> `).join('')||'—'}</div></div>`).join('')+`<p style="color:var(--mut)">${T('تعديل الأدوار يتم من الخادم فقط.','Role changes are server-side only.')}</p>`},

async audit(){const a=await q(SB.from('audit_log').select('*').order('at',{ascending:false}).limit(200));
 return `<div class="panel">${a.length?`<div class="tw"><table>${a.map(x=>`<tr><td>${fd(x.at)}</td><td>${esc(x.action)}</td><td>${esc(x.target_table||'')} ${esc(x.target_id||'')}</td><td dir="ltr"><small>${esc(JSON.stringify(x.details||{})).slice(0,120)}</small></td></tr>`).join('')}</table></div>`:empty()}</div>`}
};

function renderSubs(){const f=($('#f')?.value||'').toLowerCase(),s=$('#fs')?.value,r=window._subs.filter(x=>(!s||x.status===s)&&(x.name+x.email).toLowerCase().includes(f));
 $('#tb').innerHTML=r.length?`<table><tr><th>${T('الطالب','Student')}</th><th>${T('الباقة','Plan')}</th><th>${T('الدفع','Payment')}</th><th>${T('الحالة','Status')}</th><th>${T('التاريخ','Date')}</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.email)}</small></td><td>${esc(x.plan)}</td><td>${esc(x.method)}${x.amount?` · ${esc(x.amount)}`:''}<br><small>${esc(x.payment_status||'')} ${esc(x.ref||'')}</small></td><td>${tag(x.status)}${x.expires?`<br><small>${fd(x.expires)}</small>`:''}</td><td>${fd(x.created)}</td><td class="row">${x.receipt?`<a class="btn" target="_blank" rel="noopener" href="${esc(safeUrl(x.receipt))}">${T('الإيصال','Receipt')}</a>`:''}${x.status==='pending'?`<button class="btn p" data-act="rv" data-id="${x.id}" data-a="active">${T('تفعيل','Approve')}</button><button class="btn d" data-act="rv" data-id="${x.id}" data-a="rejected">${T('رفض','Reject')}</button>`:''}</td></tr>`).join('')}</table>`:empty()}
function renderStu(){const f=($('#f')?.value||'').toLowerCase(),r=window._stu.filter(x=>((x.full_name||'')+(x.email||'')+(x.phone||'')).toLowerCase().includes(f));
 $('#tb').innerHTML=r.length?`<table><tr><th>${T('الاسم','Name')}</th><th>${T('الصف','Grade')}</th><th>${T('الهاتف','Phone')}</th><th>${T('التسجيل','Joined')}</th><th>${T('الحالة','Status')}</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.full_name||'—')}<br><small>${esc(x.email)}</small>${x.is_teacher?` <span class="tag">${T('معلم','Teacher')}</span>`:''}${x.is_platform_admin?` <span class="tag">${T('أدمن','Admin')}</span>`:''}</td><td>${esc(x.grade)}</td><td dir="ltr">${esc(x.phone||'')}</td><td>${fd(x.created_at)}</td><td>${tag(x.is_active===false?'rejected':'active')}</td><td>${x.id===me.id||x.is_platform_admin?'':`<button class="btn ${x.is_active===false?'p':'d'}" data-act="act" data-id="${x.id}" data-v="${x.is_active===false}">${x.is_active===false?T('تفعيل','Activate'):T('إيقاف','Suspend')}</button>`}</td></tr>`).join('')}</table>`:empty()}

async function run(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){toast(e.message||String(e));return false}}
document.addEventListener('input',e=>{if(e.target.id==='f'||e.target.id==='fs')cur==='subs'?renderSubs():renderStu()});
document.addEventListener('submit',async e=>{const id=e.target.id;if(!id||id==='lf')return;e.preventDefault();
 const done=m=>()=>go();
 if(id==='atf')await run(async()=>q(SB.rpc('admin_set_teacher',{p_email:$('#ate').value,p_on:true})),T('تمت الإضافة','Added'))&&go();
 if(id==='gf')await run(()=>q(SB.from('grades').insert({name:$('#gn').value.trim()})),T('تمت الإضافة','Added'))&&go();
 if(id==='sf')await run(()=>q(SB.from('subjects').insert({name:$('#sn').value.trim()})),T('تمت الإضافة','Added'))&&go();
 if(id==='lf2'){if(!/^https?:\/\//i.test($('#lr').value))return toast(T('الرابط يجب أن يبدأ بـ https','URL must start with https'));
  await run(()=>q(SB.from('library_items').insert({title:$('#lt2').value.trim(),unit:$('#lu').value||null,grade_id:+$('#lg').value||null,subject_id:+$('#ls').value,academic_year:$('#ly').value||null,type:'ملف PDF',is_free:$('#lfree').checked,file_path:$('#lr').value})),T('تمت الإضافة','Added'))&&go()}
 if(id==='cf'){const m=e.submitter?.dataset.m,sn=$('#cs').value.trim().toUpperCase();
  if(m==='r'){if(confirm(T('إلغاء هذه الشهادة؟','Revoke this certificate?')))await run(()=>q(SB.rpc('admin_revoke_certificate',{p_serial:sn,p_revoke:true,p_reason:null})),T('تم الإلغاء','Revoked'))}
  else await run(async()=>{$('#co').textContent=JSON.stringify(await q(SB.rpc('verify_certificate',{p_serial:sn})),null,2)})}});
document.addEventListener('click',async e=>{
 const go_=e.target.closest('[data-go]');if(go_)return go(go_.dataset.go);
 const a=e.target.closest('[data-act]');if(!a)return;const d=a.dataset,act=d.act;a.disabled=true;
 if(act==='exp-subs')csv('subscriptions',window._subs.map(({receipt,...r})=>r));
 else if(act==='exp-stu')csv('students',window._stu.map(x=>({name:x.full_name,email:x.email,phone:x.phone,grade:x.grade,joined:x.created_at,active:x.is_active})));
 else if(act==='rv'){let r=null;if(d.a==='rejected'){r=prompt(T('سبب الرفض (اختياري)','Reason (optional)'));if(r===null){a.disabled=false;return}}
  await run(()=>q(SB.rpc('review_subscription',{p_id:+d.id,p_action:d.a,p_reason:r})),T('تم','Done'))&&go()}
 else if(act==='tr'){let r=null;if(d.a==='rejected'){r=prompt(T('سبب الرفض (اختياري)','Reason (optional)'));if(r===null){a.disabled=false;return}}
  await run(()=>q(SB.rpc('admin_review_teacher_request',{p_id:+d.id,p_action:d.a,p_reason:r})),T('تم','Done'))&&go()}
 else if(act==='rt'){if(confirm(T('إلغاء صلاحية المعلم؟','Revoke teacher access?')))await run(()=>q(SB.rpc('admin_set_teacher',{p_email:d.e,p_on:false})),T('تم','Done'))&&go()}
 else if(act==='act')await run(()=>q(SB.from('profiles').update({is_active:d.v==='true'}).eq('id',d.id)),T('تم','Done'))&&go();
 else if(act==='pub')await run(()=>q(SB.from('courses').update({is_published:d.v==='true'}).eq('id',d.id)),T('تم','Done'))&&go();
 else if(act==='del'){if(confirm(T('حذف نهائي؟','Delete permanently?')))await run(()=>q(SB.from(d.t).delete().eq('id',d.id)),T('تم الحذف','Deleted'))&&go()}
 a.disabled=false});
const origGo=go;go=async function(v){await origGo(v);if(cur==='subs'&&window._subs)renderSubs();if(cur==='students'&&window._stu)renderStu()};
$('#lang').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('dl',lang);loginText();if(me)go()};
$('#ref').onclick=()=>go();$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#out').onclick=async()=>{await SB.auth.signOut();me=null;boot()};
function loginText(){$('#lt').textContent=T('لوحة إدارة ilogia','ilogia admin');$('#em').placeholder=T('البريد الإلكتروني','Email');$('#pw').placeholder=T('كلمة المرور','Password');$('#lb').textContent=T('دخول','Sign in');$('#ll').textContent=lang==='ar'?'English':'عربي'}
$('#ll').onclick=$('#lang').onclick;
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';
 const{error}=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error)return $('#le').textContent=T('بيانات الدخول غير صحيحة','Incorrect email or password');
 if(!await enter()){await SB.auth.signOut();$('#le').textContent=T('هذا الحساب ليس لديه صلاحية','This account has no dashboard access')}};
async function enter(){
 const{data:{user}}=await SB.auth.getUser();if(!user)return false;
 try{const p=await q(SB.rpc('my_permissions'));perms=new Set(p||[])}catch{perms=new Set()}
 if(!perms.has('dashboard.view'))return false;
 me=user;$('#who').textContent=user.email;$('#login').classList.add('hide');$('#app').classList.remove('hide');
 cur=NAV.find(n=>perms.has(n[3]))[0];go();return true}
async function boot(){loginText();if(!await enter()){$('#app').classList.add('hide');$('#login').classList.remove('hide')}}
boot();
</script>
</body>
